[project]
name = "strip"
version = "2.0.0"
description = "Document ingestion engine: convert PDF/DOCX/XML into frontmatter-tagged Markdown"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "textual>=0.70",
    "rich>=13.0",
    "mammoth>=1.6",
    "pdfplumber>=0.11",
    "python-frontmatter>=1.1",
    "watchdog>=4.0",
]

[project.scripts]
strip = "strip.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["strip*"]
