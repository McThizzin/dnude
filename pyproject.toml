[project]
name = "dnude"
version = "2.0.0"
description = "Document ingestion engine: convert PDF/DOCX/XML into frontmatter-tagged Markdown"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "textual>=0.70",
    "rich>=13.0",
    "mammoth>=1.6",
    "pdfplumber>=0.11",
    "python-frontmatter>=1.1",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
dnude = "dnude.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dnude*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "B008",   # Typer idiom: typer.Argument/Option in argument defaults
    "RUF012", # Textual idiom: mutable BINDINGS class attribute
]
